defaults:
  - algorithm: dynasaur_cartpole
  - dynamics_model: gaussian_mlp_ensemble
  - _self_
seed: 343
device: "cuda:0"
render: false
log_frequency_agent: 1000
save_video: false
debug_mode: True
track_wandb: true
wandb_project: "Dynasaur"
# Name of Experiment series (used as folder name to store results)
experiment: Dynasaur-Experiment
root_dir: ~
hydra:
  run:
    dir: ${root_dir}/${algorithm.name}/${experiment}/${now:%Y.%m.%d}/${now:%H%M%S}

  sweep:
    dir: ${root_dir}/${algorithm.name}/${experiment}/${now:%Y.%m.%d}/${now:%H%M%S}
  job:
    chdir: True
